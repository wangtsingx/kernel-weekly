<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内核邮件列表周刊 | Kernel Mailing List Weekly</title>
  <style>
    :root {
      --bg: #F5F4ED;
      --card: #FFFFFF;
      --border: #E5E3DC;
      --text: #3D3929;
      --text-muted: #8B8478;
      --accent: #D97757;
      --accent-soft: #F3EDE8;
      --accent-darker: #B85C3F;
      --red: #C04A3B;
      --orange: #C97B35;
      --yellow: #B89220;
      --green: #5A7A4A;
      --code-bg: #F7F6F2;
      --table-stripe: #FAF9F6;
      --radius: 10px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }
    .container { max-width: 960px; margin: 0 auto; padding: 2rem 1rem; }

    /* Header */
    header { text-align: center; padding: 3rem 1rem 2rem; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
    header h1 .icon { margin-right: 0.5rem; }
    header p { color: var(--text-muted); font-size: 0.95rem; }

    /* Stats bar */
    .stats-bar { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; margin: 1.5rem 0; }
    .stat-chip { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 0.4rem 1rem; font-size: 0.85rem; }
    .stat-chip strong { color: var(--accent); }

    /* Issue list */
    .issue-list { margin-top: 2rem; }
    .issue-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .issue-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(217,119,87,0.12); }
    .issue-card h2 { font-size: 1.15rem; margin-bottom: 0.75rem; }
    .issue-card h2 a { color: var(--text); text-decoration: none; }
    .issue-card h2 a:hover { color: var(--accent); text-decoration: underline; }
    .issue-meta { display: flex; gap: 0.75rem; flex-wrap: wrap; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.75rem; }
    .issue-meta span { display: inline-flex; align-items: center; gap: 0.3rem; }

    /* Issue body preview (collapsible) */
    .issue-body {
      max-height: 240px;
      overflow: hidden;
      position: relative;
      border-top: 1px solid var(--border);
      padding-top: 1rem;
      margin-top: 0.75rem;
    }
    .issue-body.expanded { max-height: none; }
    .issue-body .fade {
      position: absolute; bottom: 0; left: 0; right: 0; height: 80px;
      background: linear-gradient(transparent, var(--card));
      pointer-events: none;
      z-index: 1;
    }
    .issue-body.expanded .fade { display: none; }

    /* Markdown content rendering (GitHub-like) */
    .md-content { position: relative; }
    .md-content > *:first-child { margin-top: 0; }
    .md-content h1 { font-size: 1.6rem; font-weight: 700; margin: 1.5rem 0 0.75rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--border); }
    .md-content h2 { font-size: 1.3rem; font-weight: 600; margin: 1.5rem 0 0.6rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--border); color: var(--text); }
    .md-content h3 { font-size: 1.1rem; font-weight: 600; margin: 1.2rem 0 0.5rem; color: var(--accent-darker); }
    .md-content h4 { font-size: 1rem; font-weight: 600; margin: 1rem 0 0.4rem; color: var(--accent-darker); }
    .md-content p { margin: 0.5rem 0; }
    .md-content ul, .md-content ol { margin: 0.5rem 0; padding-left: 1.8rem; }
    .md-content li { margin: 0.25rem 0; }
    .md-content blockquote {
      border-left: 3px solid var(--accent);
      padding: 0.5rem 1rem;
      margin: 0.75rem 0;
      color: var(--text-muted);
      background: var(--accent-soft);
      border-radius: 0 4px 4px 0;
    }
    .md-content blockquote p { margin: 0; }
    .md-content hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
    .md-content a { color: var(--accent); text-decoration: none; }
    .md-content a:hover { text-decoration: underline; }
    .md-content strong { font-weight: 600; }
    .md-content code {
      background: var(--code-bg);
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      font-size: 0.85em;
      font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
      color: var(--accent-darker);
    }
    .md-content pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      overflow-x: auto;
      margin: 0.75rem 0;
    }
    .md-content pre code { background: none; padding: 0; border-radius: 0; color: var(--text); font-size: 0.85rem; }
    .md-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.75rem 0;
      font-size: 0.9rem;
      display: block;
      overflow-x: auto;
    }
    .md-content table thead tr { background: var(--accent-soft); }
    .md-content table th, .md-content table td {
      border: 1px solid var(--border);
      padding: 0.5rem 0.75rem;
      text-align: left;
      white-space: nowrap;
    }
    .md-content table th { font-weight: 600; }
    .md-content table tbody tr:nth-child(even) { background: var(--table-stripe); }
    .md-content img { max-width: 100%; border-radius: 4px; }

    .expand-btn {
      background: none; border: 1px solid var(--border); color: var(--accent);
      padding: 0.3rem 1rem; border-radius: 6px; cursor: pointer;
      font-size: 0.85rem; margin-top: 0.5rem;
    }
    .expand-btn:hover { background: var(--accent-soft); }

    /* Labels */
    .label {
      display: inline-block; padding: 0.15rem 0.6rem; border-radius: 20px;
      font-size: 0.75rem; font-weight: 600;
    }
    .label-weekly { background: var(--accent); color: #fff; }

    /* Loading & empty */
    .loading, .empty { text-align: center; padding: 3rem; color: var(--text-muted); }
    .spinner {
      display: inline-block; width: 32px; height: 32px;
      border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer */
    footer { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.85rem; border-top: 1px solid var(--border); margin-top: 2rem; }
    footer a { color: var(--accent); text-decoration: none; }

    /* Search */
    .search-box {
      width: 100%; padding: 0.6rem 1rem; background: var(--card);
      border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text); font-size: 0.9rem; margin-bottom: 1.5rem;
    }
    .search-box:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(217,119,87,0.15); }

    /* Responsive */
    @media (max-width: 600px) {
      header h1 { font-size: 1.5rem; }
      .issue-card { padding: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1><span class="icon">🔍</span>内核邮件列表周刊</h1>
    <p>自动爬取 lore.kernel.org 邮件列表，AI 分析问题类型、严重程度和修复方案</p>
    <div class="stats-bar" id="stats-bar">
      <div class="stat-chip">周刊数量: <strong id="stat-count">-</strong></div>
      <div class="stat-chip">最近更新: <strong id="stat-latest">-</strong></div>
      <div class="stat-chip">数据源: <strong>lore.kernel.org</strong></div>
    </div>
  </header>

  <div class="container">
    <input type="text" class="search-box" id="search" placeholder="搜索周刊标题或内容…" oninput="filterIssues()">
    <div class="issue-list" id="issue-list">
      <div class="loading"><div class="spinner"></div><p style="margin-top:1rem">正在加载周刊…</p></div>
    </div>
  </div>

  <footer>
    <p>由 <a href="https://github.com/wangtsingx/kernel-weekly" target="_blank">Multica autopilot</a> 自动生成 · 数据来源 <a href="https://lore.kernel.org" target="_blank">lore.kernel.org</a></p>
  </footer>

  <!-- marked.js for markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- DOMPurify for XSS prevention -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script>
    const REPO = 'wangtsingx/kernel-weekly';
    const API = `https://api.github.com/repos/${REPO}/issues`;
    let allIssues = [];

    // Configure marked
    marked.setOptions({ breaks: true, gfm: true });

    async function loadIssues() {
      try {
        const url = `${API}?state=all&per_page=100&sort=created&direction=desc`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const issues = await res.json();
        allIssues = issues.filter(i => !i.pull_request && i.title.includes('周刊'));

        if (allIssues.length === 0) {
          document.getElementById('issue-list').innerHTML =
            '<div class="empty"><p>暂无周刊。首次运行后将自动出现。</p></div>';
          return;
        }

        document.getElementById('stat-count').textContent = allIssues.length;
        const latest = allIssues[0];
        document.getElementById('stat-latest').textContent =
          new Date(latest.created_at).toISOString().slice(0, 10);

        renderIssues(allIssues);
      } catch (err) {
        document.getElementById('issue-list').innerHTML =
          '<div class="empty"><p>加载失败: ' + escapeHtml(err.message) + '</p><p style="margin-top:0.5rem;font-size:0.85rem">GitHub API 速率限制可能已触发，请稍后刷新。</p></div>';
      }
    }

    function renderIssues(issues) {
      const list = document.getElementById('issue-list');
      list.innerHTML = issues.map(issue => {
        const date = new Date(issue.created_at).toISOString().slice(0, 10);
        const bodyHtml = renderMarkdown(issue.body || '(无内容)');
        const labels = issue.labels.map(l =>
          '<span class="label" style="background:#' + l.color + ';color:#' + (l.color === 'ffffff' ? '333' : 'fff') + '">' + escapeHtml(l.name) + '</span>'
        ).join(' ');

        return '<div class="issue-card" data-title="' + escapeHtml(issue.title.toLowerCase()) + '" data-body="' + escapeHtml((issue.body || '').toLowerCase()) + '">' +
          '<h2><a href="' + issue.html_url + '" target="_blank">' + escapeHtml(issue.title) + '</a></h2>' +
          '<div class="issue-meta">' +
            '<span>📅 ' + date + '</span>' +
            '<span>👤 ' + escapeHtml(issue.user.login) + '</span>' +
            '<span>💬 ' + issue.comments + '</span>' +
            (labels ? '<span>' + labels + '</span>' : '') +
            '<span>#' + issue.number + '</span>' +
          '</div>' +
          '<div class="issue-body" id="body-' + issue.number + '">' +
            '<div class="md-content">' + bodyHtml + '</div>' +
            '<div class="fade"></div>' +
          '</div>' +
          '<button class="expand-btn" onclick="toggleBody(' + issue.number + ', this)">展开全文 ↓</button>' +
        '</div>';
      }).join('');
    }

    function toggleBody(num, btn) {
      const body = document.getElementById('body-' + num);
      if (body.classList.contains('expanded')) {
        body.classList.remove('expanded');
        btn.textContent = '展开全文 ↓';
      } else {
        body.classList.add('expanded');
        btn.textContent = '收起 ↑';
      }
    }

    function filterIssues() {
      const q = document.getElementById('search').value.toLowerCase();
      if (!q) { renderIssues(allIssues); return; }
      const filtered = allIssues.filter(i =>
        i.title.toLowerCase().includes(q) || (i.body || '').toLowerCase().includes(q)
      );
      if (filtered.length === 0) {
        document.getElementById('issue-list').innerHTML =
          '<div class="empty"><p>未找到匹配的周刊。</p></div>';
      } else {
        renderIssues(filtered);
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function renderMarkdown(md) {
      const raw = marked.parse(md);
      return DOMPurify.sanitize(raw, {
        ALLOWED_TAGS: ['h1','h2','h3','h4','h5','h6','p','br','hr','ul','ol','li','blockquote','pre','code','a','strong','em','del','table','thead','tbody','tr','th','td','img','span','div','sup'],
        ALLOWED_ATTR: ['href','src','alt','title','style','colspan','rowspan','target','rel']
      });
    }

    loadIssues();
  </script>
</body>
</html>
